# Dictionnaire de pré-classement (lot 2, fonction F4).
#
# Le collecteur coche un pilier ou un tag dès qu'un de ses mots-clés apparaît
# dans le titre ou l'extrait d'un article. C'est une suggestion : on corrige au tri.
#
# Règles de lecture :
# - majuscules, minuscules et accents sont ignorés ("prevoyance" = "Prévoyance") ;
# - un mot-clé n'est reconnu que comme mot entier ("ani" ne déclenche pas "animal") ;
# - un mot-clé écrit TOUT EN MAJUSCULES (IA, ANI, DSN...) n'est reconnu qu'en majuscules,
#   pour éviter les faux positifs ("ia" dans un mot anglais, "ani" dans un prénom).
# Pour désactiver tout le pré-classement : passer "actif" à false.

