name: Digest hebdomadaire

on:
  schedule:
    # Lundi 4 h 30 UTC : 5 h 30 à Paris en hiver, 6 h 30 en été. GitHub peut lancer
    # une tâche planifiée avec du retard : cette marge garantit une arrivée avant 8 h.
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Aperçu (rien n'est envoyé) ou envoi réel"
        type: choice
        options: [apercu, envoi]
        default: apercu

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collecteur/requirements.txt
      - run: pip install -r collecteur/requirements.txt
      - name: Composer le digest (aperçu)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apercu'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python collecteur/digest.py --apercu digest.html
      - name: Publier l'aperçu
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'apercu'
        uses: actions/upload-artifact@v4
        with:
          name: apercu-digest
          path: digest.html
          retention-days: 7
      - name: Envoyer le digest
        if: github.event_name == 'schedule' || inputs.mode == 'envoi'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python collecteur/digest.py
