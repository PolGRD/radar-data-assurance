name: Vérifications

# Contrôle automatique de chaque demande de fusion (pull request) et de main :
# si une étape échoue, GitHub l'affiche en rouge avant la fusion.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site (style, typage, compilation)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Règles de style (ESLint)
        run: npm run lint
      - name: Typage (TypeScript)
        run: npm run typecheck
      # Compilation sans accès à Notion : on vérifie que le site se construit, pas son contenu.
      - name: Compilation (Next.js)
        run: npm run build

  collecteur:
    name: Collecteur (tests Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collecteur/requirements.txt
      - run: pip install -r collecteur/requirements.txt pytest
      - name: Tests du collecteur
        run: python -m pytest collecteur/tests -q
